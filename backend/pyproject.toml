[project]
name = "python-lms-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "greenlet>=3.1",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "alembic>=1.14",
  "redis>=5.2",
  "httpx>=0.27",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
